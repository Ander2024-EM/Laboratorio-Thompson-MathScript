name: Publicar laboratorio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probar los doce modelos y las entradas de referencia
        run: node --test tests/engine.test.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir solo el laboratorio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/laboratorio-thompson/
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
